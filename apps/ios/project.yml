name: Togo

options:
  bundleIdPrefix: app.togo
  xcodeVersion: "27.2"
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  # XcodeGen #1613: the watch app is copied into Watch/ with a products-directory
  # destination that Xcode 26+ rejects on device install. Remove once #1614 ships.
  postGenCommand: >-
    sed -i '' -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|'
    -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|' Togo.xcodeproj/project.pbxproj

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  TogoKit:
    path: ../../packages/TogoKit
  TogoTerminal:
    path: ../../packages/TogoTerminal
  TogoMosh:
    path: ../../packages/TogoMosh
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7

targets:
  Togo:
    type: application
    platform: iOS
    sources:
      - path: Togo
    dependencies:
      - package: TogoKit
      - package: TogoTerminal
      - package: TogoMosh
      - target: TogoWatch
      - target: TogoWidgets
      - target: TogoNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.Togo
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # No icon until the brand mark is final; XcodeGen defaults to AppIcon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS: YES
        # Palette.swift declares Color.togo* itself; Xcode's extensions would
        # add a second, differently named set.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "Debug/Resources/*"
    info:
      path: Togo/Info.plist
      properties:
        CFBundleDisplayName: Togo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Ink
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CADisableMinimumFrameDurationOnPhone: true
        NSFaceIDUsageDescription: Unlock your SSH keys.
        NSLocalNetworkUsageDescription: Find and connect to the machines on your network.
        NSBonjourServices:
          - _ssh._tcp
        CFBundleURLTypes:
          - CFBundleURLName: app.togo
            CFBundleURLSchemes:
              - togo
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Togo/Togo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.togo
        # Machines sync through key-value storage; keys and passwords never do.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)

  TogoWatch:
    type: application
    platform: watchOS
    sources:
      - path: TogoWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.Togo.watchkitapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Togo
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.togo.Togo

  TogoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TogoWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.Togo.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: TogoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Togo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TogoWidgets/TogoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.togo

  TogoNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: TogoNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.Togo.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: TogoNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Togo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: TogoNotificationService/TogoNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.togo

  TogoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TogoTests
    dependencies:
      - target: Togo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.TogoTests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES

  # Snapshot references are recorded on the iPhone 17 simulator; the library is never linked
  # into the app.
  TogoSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TogoSnapshotTests
        excludes:
          - "**/__Snapshots__"
    dependencies:
      - target: Togo
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.TogoSnapshotTests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES

  # Runs from its own scheme so the unit and snapshot runs never wait on a UI test launch.
  TogoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TogoUITests
    dependencies:
      - target: Togo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.TogoUITests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Togo

schemes:
  Togo:
    build:
      targets:
        Togo: all
        TogoTests: [test]
        TogoSnapshotTests: [test]
        TogoUITests: [test]
    test:
      config: Debug
      targets:
        - TogoTests
        - TogoSnapshotTests

  TogoUITests:
    build:
      targets:
        Togo: all
        TogoUITests: [test]
    test:
      config: Debug
      targets:
        - TogoUITests
