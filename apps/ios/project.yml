name: Togo

options:
  bundleIdPrefix: app.togo
  xcodeVersion: "27.2"
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  # XcodeGen #1613: the watch app is copied into Watch/ with a products-directory
  # destination that Xcode 26+ rejects on device install. Remove once #1614 ships.
  postGenCommand: >-
    sed -i '' -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|'
    -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|' Togo.xcodeproj/project.pbxproj

# One version for every bundle: App Store Connect rejects an upload whose app, Watch app and
# extensions disagree.
settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  TogoKit:
    path: ../../packages/TogoKit
  TogoTerminal:
    path: ../../packages/TogoTerminal
  TogoMosh:
    path: ../../packages/TogoMosh
  TogoPush:
    path: ../../packages/TogoPush
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7
  # WhisperKit (Argmax, MIT), the optional second dictation engine. Its only package
  # dependency, swift-argument-parser, serves its command line tool and never links.
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1

targets:
  Togo:
    type: application
    platform: iOS
    sources:
      - path: Togo
      # The Live Activity and widget views, so the snapshot tests can render them.
      - path: TogoWidgets/LiveCopy.swift
      - path: TogoWidgets/LiveLockScreenView.swift
      - path: TogoWidgets/IslandViews.swift
      - path: TogoWidgets/LiveParts.swift
      - path: TogoWidgets/LiveAnswerIntents.swift
      - path: TogoWidgets/WaitingWidget.swift
    dependencies:
      - package: TogoKit
      - package: TogoTerminal
      - package: TogoMosh
      - package: TogoPush
      - package: argmax-oss-swift
        product: WhisperKit
      # A watchOS app ships inside the iPhone app's Watch folder; without the explicit copy,
      # XcodeGen puts it in PlugIns and iOS never offers it to the Watch.
      - target: TogoWatch
        embed: true
        copy:
          destination: wrapper
          subpath: Watch
      - target: TogoWidgets
      - target: TogoNotificationService
    preBuildScripts:
      # A Release build stops while the helper's pinned update key is still the test key.
      - name: Check release key
        script: |
          if [ "$CONFIGURATION" = "Release" ] && [ "${TOGO_ALLOW_TEST_RELEASE_KEY:-NO}" != "YES" ]; then
            "$SRCROOT/../../scripts/check-release-key.sh" "$SRCROOT/../../helper/internal/release/minisign.pub"
          fi
        inputFiles:
          - $(SRCROOT)/../../scripts/check-release-key.sh
          - $(SRCROOT)/../../helper/internal/release/minisign.pub
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # Blink's prebuilt mosh.framework has an unparseable MinimumOSVersion and a four-part
      # version, which App Store Connect rejects. Runs before the app's own signature.
      - name: Normalize embedded frameworks
        script: '"$SRCROOT/../../scripts/fix-embedded-frameworks.sh"'
        inputFiles:
          - $(SRCROOT)/../../scripts/fix-embedded-frameworks.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.Togo
        # The framework-normalizing script edits and re-signs files it cannot declare as outputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # System-drawn surfaces (share sheets, alerts, UIKit text views) take the app's snow,
        # never system blue: blue reads as the beacon, which only means needs-you.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Snow
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS: YES
        # Palette.swift declares Color.togo* itself; Xcode's extensions would
        # add a second, differently named set.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "Debug/Resources/*"
    info:
      path: Togo/Info.plist
      properties:
        # ITSAppUsesNonExemptEncryption is left out on purpose: App Store Connect asks the
        # export compliance questions per build until an approved declaration supplies
        # ITSEncryptionExportComplianceCode (standard SSH, Mosh and CryptoKit cryptography only).
        CFBundleDisplayName: Togo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The mark at the size and place of the launch overlay's first frame, so the
        # overlay picks up from it without a jump.
        UILaunchScreen:
          UIColorName: Ink
          UIImageName: LaunchMark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: "Take a photo to send to an agent in a session. Location is removed before it leaves the phone."
        NSFaceIDUsageDescription: Unlock Togo and your saved keys and passwords.
        NSLocalNetworkUsageDescription: Find and connect to the machines on your network.
        NSMicrophoneUsageDescription: "Togo uses the microphone only while you dictate into a session, and turns speech into text on this device."
        NSSpeechRecognitionUsageDescription: "Speech becomes text on this device. Nothing is sent anywhere."
        # A tab dragged between windows or panes.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.togo.tab
            UTTypeDescription: Togo tab
            UTTypeConformsTo:
              - public.data
        NSBonjourServices:
          - _ssh._tcp
        # Port previews load http://127.0.0.1 in a web view.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: app.togo
            CFBundleURLSchemes:
              - togo
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        TogoRelayHost: $(TOGO_RELAY_HOST)
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Togo/Togo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.togo
        # Machines sync through key-value storage; keys and passwords never do.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # Development here; automatic signing writes production into Release builds.
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        # Push keys, shared with the notification service and the widgets.
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.togo.shared

  TogoWatch:
    type: application
    platform: watchOS
    sources:
      - path: TogoWatch
      # The app's motion roles and choreography, so the Watch moves the way the phone does.
      # Motion.swift itself holds UIKit animators watchOS lacks; TogoWatch/WatchMotion.swift
      # stands in for the part the Watch needs.
      - path: Togo/Design/MotionTokens.swift
      - path: Togo/Design/MotionChoreography.swift
    dependencies:
      - package: TogoPush
      - target: TogoWatchWidgets
      - target: TogoWatchNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.Togo.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Togo
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.togo.Togo
    info:
      path: TogoWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - remote-notification
        WKRunsIndependentlyOfCompanionApp: true
    entitlements:
      path: TogoWatch/TogoWatch.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.app.togo.watch
        # The Watch keeps its own push keys.
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.togo.watch
    scheme:
      testTargets:
        - TogoWatchTests

  TogoWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: TogoWatchWidgets
      # The control's intent, also in the app so it can run there when the control opens it.
      - path: TogoWatch/Intents/OpenWaitingIntent.swift
    dependencies:
      - package: TogoPush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.Togo.watchkitapp.Widgets
    info:
      path: TogoWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Togo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TogoWatchWidgets/TogoWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.togo.watch
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.togo.watch

  TogoWatchNotificationService:
    type: app-extension
    platform: watchOS
    sources:
      - path: TogoWatchNotificationService
    dependencies:
      - package: TogoPush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.Togo.watchkitapp.NotificationService
    info:
      path: TogoWatchNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Togo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: TogoWatchNotificationService/TogoWatchNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.togo.watch
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.togo.watch

  TogoWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: TogoWatchTests
    dependencies:
      - target: TogoWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.TogoWatchTests
        GENERATE_INFOPLIST_FILE: YES

  TogoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TogoWidgets
      # The app's palette and bib, so the widgets draw with the same colors.
      - path: Togo/Design/Palette.swift
      - path: Togo/Design/Components/BibText.swift
      - path: Togo/Resources/Colors.xcassets
      # The agents' marks, for the Live Activity.
      - path: Togo/Resources/Images.xcassets
      # The app's strings, so Live Activity and widget copy can be translated with the app's.
      - path: Togo/Resources/Localizable.xcstrings
    dependencies:
      - package: TogoPush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.Togo.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Snow
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    info:
      path: TogoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Togo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TogoWidgets/TogoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.togo
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.togo.shared

  TogoNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: TogoNotificationService
    dependencies:
      - package: TogoPush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.Togo.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: TogoNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Togo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: TogoNotificationService/TogoNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.togo
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.togo.shared

  TogoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TogoTests
    dependencies:
      - target: Togo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.TogoTests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES

  # Snapshot references are recorded on the iPhone 17 simulator; the library is never linked
  # into the app.
  TogoSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TogoSnapshotTests
        excludes:
          - "**/__Snapshots__"
    dependencies:
      - target: Togo
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.TogoSnapshotTests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES

  # Runs from its own scheme so the unit and snapshot runs never wait on a UI test launch.
  TogoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TogoUITests
    dependencies:
      - target: Togo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.togo.TogoUITests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Togo

schemes:
  Togo:
    build:
      targets:
        Togo: all
        TogoTests: [test]
        TogoSnapshotTests: [test]
        TogoUITests: [test]
    test:
      config: Debug
      targets:
        - TogoTests
        - TogoSnapshotTests

  TogoUITests:
    build:
      targets:
        Togo: all
        TogoUITests: [test]
    test:
      config: Debug
      targets:
        - TogoUITests
