name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    env:
      OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Signed-off-by
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format=%ae "$sha")"
            if [ -n "$OWNER_EMAIL" ] && [ "$author" = "$OWNER_EMAIL" ]; then
              continue
            fi
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::$sha by $author has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit "$missing"
