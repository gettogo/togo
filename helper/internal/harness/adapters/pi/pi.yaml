# Pi (pi-mono coding agent) 0.73. Sessions are JSONL v3 under
# ~/.pi/agent/sessions/--<cwd with / as ->--/<timestamp>_<uuid>.jsonl (docs/session-format.md,
# session-manager.js), read live by the shared pisession mapper. Pi has no subagents, plan
# mode or background jobs by design. Its RPC mode is a separate process, so the live TUI is
# changed by typing its slash commands (slash-commands.js) or relaunching with flags.
# Nothing here could be exercised end to end: Pi needs a provider login to run a turn.
adapter: pi
name: Pi
revision: 1
match: { agents: [pi], commands: [pi] }
# Without a terminal on stdin pi prints its version on stderr.
harness: { version: [pi, --version], pattern: '^(\d+\.\d+\.\d+)', range: ">=0.73 <0.80", stderr: merge }
capabilities: [chat, chat.anchors, chat.history, send.queue, interrupt, commands, files, model, effort,
  changes, status, resume, compact]
feeds:
  session:
    # exclusive: follow only a file this session's own agent process holds open (a /new moves it,
    # the old file is dropped); a file another process holds is never taken; with no evidence the
    # session keeps its file.
    jsonl: { glob: '~/.pi/agent/sessions/-{{.cwd | replace "/" "-"}}--/*.jsonl', follow: true, exclusive: true }   # every session of a cwd shares the folder
    mapper: pi.session
    stability: documented
sources:
  # pi's rpc mode answers get_available_models without a session or network.
  models:
    rpc: { method: get_available_models, child: [pi, --mode, rpc, --no-session, --offline], framing: typed }
    select: '[(.models // [])[] | {id: (.provider + "/" + .id), provider: .provider, name: (.name // .id), thinking: (.reasoning == true), context: ((.contextWindow // 0) as $c | if $c >= 1000000 then ((($c / 100000) | floor) / 10 | tostring) + "M" elif $c >= 1000 then ((($c / 100) | floor) / 10 | tostring) + "K" else ($c | tostring) end)}]'
    cache: 10m
    timeout: 12s
    stability: documented
    # `pi --list-models` prints the same as a table, on stderr without a terminal.
    fallback:
      cli: { argv: [pi, --list-models, --offline], format: text, stderr: merge }
      select: '[split("\n")[1:][] | select(length > 0) | [splits(" +")] | {id: (.[0] + "/" + .[1]), provider: .[0], name: .[1], context: .[2], thinking: (.[4] == "yes")}]'
  sessions:
    file: { glob: '~/.pi/agent/sessions/-{{.cwd | replace "/" "-"}}--/*.jsonl', format: jsonl }
    select: '[.[] | {id: (.head.id // .name), title: ([.tail[] | select(.type == "session_info") | .name] | last // .name), updated: .mtime}]'
    cache: 30s
    stability: documented
screens:
  model:
    primitive: picker
    title: Model
    section: composer
    capability: model
    source: models
    search: true
    map: { item.id: .id, item.title: .name, item.group: .provider, item.subtitle: '{{.context}} context', selected: $state.model }
    filters: [{ id: provider, label: Provider, kind: choice, field: provider }]
    on_select: set_model
  effort:
    primitive: settings
    title: Thinking
    section: composer
    capability: effort
    fields:
      - { id: thinking, label: Thinking, kind: choice, value: $state.effort, options: [off, minimal, low, medium, high, xhigh], action: set_effort }
  resume:
    primitive: picker
    title: Resume
    section: more
    capability: resume
    source: sessions
    search: true
    map: { item.id: .id, item.title: .title, item.subtitle: '{{.updated | ago}}' }
    on_select: resume
actions:
  # Typing /model saves the pick as Pi's default model in
  # ~/.pi/agent/settings.json, changing every later session. `--model`
  # on a relaunch applies to this session only; the restart reopens the
  # same session file and keeps its thinking level (and the model, for a
  # thinking change). --session names this session, where --continue
  # would take the folder's newest one, which may be another Pi's.
  set_model:
    label: Use model
    confirm: Restart Pi on this model? The session continues; the model applies to this session only.
    branch:
      - when: '{{if .state.harness_session}}true{{end}}'
        relaunch:
          argv: [pi, --session, '{{.state.harness_session}}', --model, '{{.id}}']
          keep: [[--thinking, '{{.state.effort}}']]
      - relaunch:
          argv: [pi, --model, '{{.id}}']
          keep: [[--thinking, '{{.state.effort}}']]
    stability: documented
  set_effort:
    label: Set thinking
    confirm: Restart Pi with this thinking level? The session continues.
    branch:
      - when: '{{if .state.harness_session}}true{{end}}'
        relaunch:
          argv: [pi, --session, '{{.state.harness_session}}', --thinking, '{{.value}}']
          keep: [[--model, '{{.state.model}}']]
      - relaunch:
          argv: [pi, --thinking, '{{.value}}', --continue]
          keep: [[--model, '{{.state.model}}']]
    stability: documented
  compact:
    confirm: Compact the session now?
    type: { text: '/compact', submit: true, when_idle: true }
    stability: unverified
  resume:
    relaunch: { argv: [pi, --session, '{{.id}}'] }
    stability: documented
  interrupt:
    keys: { keys: [Escape] }
    stability: documented
status:
  actions: [compact]   # inline on the context meter
commands:
  static:
    - { name: model, detail: Select model, screen: model }
    - { name: compact, detail: Manually compact the session context, action: compact }
    - { name: resume, detail: Resume a different session, screen: resume }
    - { name: new, detail: Start a new session, role: destructive }
    - { name: name, hint: '<name>', detail: Set session display name }
    - { name: session, detail: Show session info and stats, opens: status }
    - { name: tree, detail: Navigate session tree, kind: terminal }
    - { name: fork, detail: Create a new fork from a previous user message, kind: terminal }
    - { name: settings, detail: Open settings menu, kind: terminal }
