# GitHub Copilot CLI 1.0.x. No attach protocol for the TUI (`--acp` is a separate stdio agent).
# Reads: documented hooks (camelCase events and fields; `togo hook copilot` maps them to
# Claude Code's names, so the event list below uses those), which also draw the chat; the
# session list from ~/.copilot/session-state/<id>/events.jsonl (undocumented, unverified: the
# owner has not logged in). Writes: documented slash commands with arguments (`/model x`,
# `/compact focus`, `/resume id`). The Shift+Tab mode cycle has no readable confirmation yet, so
# the mode stays in the terminal.
adapter: copilot
name: Copilot CLI
revision: 1
match: { agents: [copilot], commands: [copilot] }
harness: { version: [copilot, --version], pattern: '(\d+\.\d+\.\d+)', range: ">=1.0.100 <2" }
# No status capability: the hooks carry no model, usage or context to fill one.
capabilities: [chat, chat.anchors, send.queue, interrupt, commands, files, model, needs.approvals, needs.questions,
  agents, changes, ports, resume, compact]
feeds:
  hooks:            # `togo hook copilot <event>` in ~/.copilot/hooks/togo.json (installed only by `togo hooks install --agent copilot`)
    hook:
      events: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, PostToolUseFailure,
        PermissionRequest, Stop, SubagentStart, SubagentStop, ErrorOccurred, PreCompact,
        Notification, SessionEnd]
    mapper: copilot.hooks
    stability: experimental
sources:
  sessions:         # head record is session.start with the folder; unverified
    file: { glob: '~/.copilot/session-state/*/events.jsonl', format: jsonl }
    select: '[.[] | select((.head[0].data.context.cwd // .head[0].data.cwd // "") == $state.cwd) | {id: (.path | split("/") | .[-2]), updated: .mtime, title: ([.tail[] | select(.type == "user.message") | .data.content] | last)}]'
    cache: 30s
    stability: internal
  # `copilot help config` lists the models its `model` setting takes, one
  # quoted id per line under `model`:; Auto lets Copilot pick.
  models:
    cli: { argv: [copilot, help, config], format: text }
    select: '[{id: "auto", label: "Auto", detail: "Copilot picks per request"}] + [(split("`model`:")[1] // "") | (split("\n\n")[0] // "") | split("\n")[] | capture("^\\s*- \"(?<id>[^\"]+)\"") | {id: .id, label: .id}]'
    cache: 1h
    timeout: 15s
    stability: documented
    fallback:
      static:
        - { id: auto, label: Auto, detail: Copilot picks per request }
screens:
  model:
    primitive: picker
    title: Model
    section: composer
    capability: model
    source: models
    search: true
    map: { item.id: .id, item.title: .label, item.subtitle: .detail, selected: $state.model }
    on_select: set_model
  resume:
    primitive: picker
    title: Resume
    section: more
    capability: resume
    source: sessions
    search: true
    map: { item.id: .id, item.title: '{{.title | default .id | truncate 60}}', item.subtitle: '{{.updated | ago}}' }
    on_select: resume
actions:
  set_model:
    label: Use model
    type: { text: '/model {{.id}}', submit: true, when_idle: true }
    stability: documented-command
  compact:
    label: Compact
    confirm: Compact the conversation now?
    type: { text: '/compact {{.focus}}', submit: true, when_idle: true }
    stability: documented-command
  resume:
    label: Resume
    branch:
      - { when: '{{.state.idle}}', type: { text: '/resume {{.id}}', submit: true, when_idle: true } }
      - { relaunch: { argv: [copilot, '--resume={{.id}}'] } }
    stability: documented-command
  answer:            # question items: keys on the dialog drawn (detect.ParseChoice)
    builtin: screen_answer
    stability: experimental
  interrupt:
    keys: { keys: [Escape] }
    stability: documented
status:
  actions: [compact]   # inline on the context meter, once a status block exists
commands:
  static:
    - { name: model, hint: '[model]', detail: Select the model, kind: picker, screen: model }
    - { name: compact, hint: '[focus]', detail: Summarise the conversation, action: compact }
    - { name: resume, hint: '[id]', detail: Switch sessions, screen: resume }
    - { name: plan, detail: Plan before coding }
    - { name: tasks, detail: Subagents and shell tasks, kind: terminal }
    - { name: diff, detail: Review changes, opens: changes }
    - { name: usage, detail: Session usage, kind: terminal }
    - { name: context, detail: Context window usage, kind: terminal }
