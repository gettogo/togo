# Auggie (Augment CLI). Terminal-only by owner decision (2026-11-10): Auggie 1.x is a rewrite
# on pi whose models are Augment-hosted only (bring-your-own-key does not reach the CLI), so
# its native chat could not be kept verified. It runs as a plain terminal session; the shared
# screen watcher still turns its dialogs into phone prompts (the tool permission "Allow?" Yes /
# No, the indexing chooser, the ask-user question dialog), answered with keys. Captures of
# those dialogs from 1.2.0 are in testdata/screens.
adapter: auggie
name: Auggie
revision: 1
match: { agents: [auggie], commands: [auggie] }
harness: { version: [auggie, --version], pattern: '^(\d+\.\d+\.\d+)', range: ">=0.37 <2" }
capabilities: []
