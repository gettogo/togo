# Goose 1.57 (block/goose). No attach protocol for the TUI (`goose acp` and `goose serve` host
# their own sessions) and no hooks. Chat: Goose keeps every session in one sqlite database,
# ~/.local/share/goose/sessions/sessions.db (WAL; tables sessions and messages, read from a
# real 1.57 database). The helper polls it read-only through the system sqlite3: the
# sessions feed picks the session working in this folder touched since Togo started it (the
# TUI creates its row at launch), which gives the session id and its goose_mode; the chat
# feed then follows that session's messages by row id. Goose stores a message once it is
# whole, so replies show when they end and tool calls when asked, not token by token.
# Messages with userVisible false (the per-turn <turn-context>) are skipped. A failed turn
# ends in an assistant message with an error part ({type: error, kind: authentication |
# contextLengthExceeded | other, message}, read from a real 1.57 database): it maps to an
# error notice and the turn ends failed.
# Writes: documented in-TUI commands with arguments (`/mode`, `/model`), relaunch with
# `session --resume --session-id`. Sessions: `goose session list --format json --working_dir`.
adapter: goose
name: Goose
revision: 1
match: { agents: [goose], commands: [goose] }
harness: { version: [goose, --version], pattern: '(\d+\.\d+\.\d+)', range: ">=1.57 <2" }
# No model capability: nothing reads the current model and there is no model list.
capabilities: [chat, chat.anchors, chat.history, send.queue, interrupt, commands, mode, changes,
  ports, resume, compact, needs.approvals, needs.questions]
feeds:
  session:          # sessions touched since this Togo session began; the mapper keeps this folder's
    sqlite:
      path: '~/.local/share/goose/sessions/sessions.db'
      query: >-
        select id, working_dir, goose_mode, name, created_at, updated_at from sessions
        where session_type = 'user' and (created_at >= datetime(:created, '-1 minute')
        or updated_at >= datetime(:created, '-1 minute'))
      params: { created: '{{.created}}' }
      key: id
    mapper: goose.db
    stability: internal
  chat:
    sqlite:
      path: '~/.local/share/goose/sessions/sessions.db'
      query: >-
        select id, message_id, session_id, role, content_json, created_timestamp, metadata_json
        from messages where session_id = :sid and id > :cursor order by id limit 200
      params: { sid: '{{.state.harness_session}}' }
      cursor: id
      key: id
    mapper: goose.db
    stability: internal
sources:
  sessions:
    cli: { argv: [goose, session, list, --format, json, --working_dir, '{{.cwd}}', --limit, '50'] }
    select: '[.[] | {id: .id, title: (.name // .description // .id), updated: (.updated_at // .modified // null)}]'
    cache: 30s
    timeout: 10s
    stability: documented
screens:
  resume:
    primitive: picker
    title: Resume
    section: more
    capability: resume
    source: sessions
    search: true
    map: { item.id: .id, item.title: '{{.title | truncate 60}}', item.subtitle: '{{.updated | ago}}' }
    on_select: resume
actions:
  set_mode:
    label: Mode
    type: { text: '/mode {{.id}}', submit: true, when_idle: true }
    stability: documented-command
  set_model:
    label: Use model
    type: { text: '/model {{.id}}', submit: true, when_idle: true }
    stability: documented-command
  compact:
    label: Compact
    confirm: Compact the conversation now?
    type: { text: '/compact', submit: true, when_idle: true }
    stability: documented-command
  resume:
    label: Resume
    relaunch: { argv: [goose, session, --resume, --session-id, '{{.id}}'] }
    stability: documented
  interrupt:
    keys: { keys: [C-c] }
    stability: documented
  # A tool confirmation (approve and smart_approve modes) is stored as an actionRequired part (the
  # question "Allow shell: make?") while the CLI's cliclack select waits: "Goose would like to call
  # the above tool, do you allow?" Allow / Always Allow / Deny / Cancel. The screen watcher reads
  # that select; the answer is one pick through it. MCP elicitations are line prompts, read on
  # screen; they are stored only once answered.
  answer:
    builtin: approval_answer
    stability: experimental
modes:
  # The mapper reads the mode from the session row's goose_mode.
  choices:
    - { id: approve, label: Ask }
    - { id: smart_approve, label: Smart }
    - { id: auto, label: Auto }
    - { id: chat, label: Chat only }
  set: set_mode
commands:
  static:
    - { name: mode, hint: '<auto|approve|smart_approve|chat>', detail: Set the goose mode, kind: choice, action: set_mode }
    - { name: model, hint: '[name]', detail: Show or switch the model, kind: args }
    - { name: compact, detail: Compact the conversation, action: compact }
    - { name: prompts, detail: List extension prompts, kind: terminal }
    - { name: skills, detail: List or enable skills, kind: terminal }
