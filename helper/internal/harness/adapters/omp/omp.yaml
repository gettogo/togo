# omp (oh-my-pi). rpc mode is a separate process, so the live TUI is read
# through its session JSONL and the CLI's JSON output, and changed by typing
# its documented slash commands, or with `omp config set` for new sessions.
# Checked against omp 18.16.0.
adapter: omp
name: omp
revision: 1
match: { agents: [omp], commands: [omp] }
harness: { version: [omp, --version], pattern: 'omp/(\S+)', range: ">=18.10 <19" }
capabilities: [chat, chat.anchors, chat.history, send.queue, interrupt, commands, files, model, effort,
  agents, background, plan, changes, ports, status, compact, settings, needs.questions]
images: { insert: together }   # how image paths are pasted into the input
mentions: { quote: double }    # a path with a space is written @"path"; bare, omp reads it up to the space
# The input line is the row under the status bar: "╰─ text", with the
# effort hint at its right end when it is empty. C-u empties it; a slash
# command's completion popup closes with Escape and keeps the text (seen on
# 18.16.0, where the popup once took the Enter of a typed /login).
input:
  line: '^╰─(?: (.*?))?(?:\s{2,}⇧⇥ to change thinking effort)?\s*$'
  clear: [C-u]
  dismiss: [Escape]
feeds:
  # omp_agent is omp's agent folder: ~/.omp/agent unless PI_CONFIG_DIR, PI_CODING_AGENT_DIR
  # or a profile moved it; omp_sessions is <agent>/sessions unless omp's XDG layout moved
  # it (roots.go).
  session:          # header {type: session, version: 3}. session_rel is the file omp's
    # terminal record (~/.omp/agent/terminal-sessions/<tty>) names for the pane: start, /new and
    # /resume move it. Without a record it is the folder's files, exclusive: only a file this
    # session's own agent holds open is taken (a /new moves it, the old file is dropped); a file
    # another process holds never is; with no evidence the session keeps its file.
    jsonl: { glob: '{{.omp_sessions}}/{{.state.session_rel}}', follow: true, exclusive: true }
    mapper: omp.session
    stability: documented
  subagents:        # task subagents: <session file without .jsonl>/<task id>.jsonl, only the
    # followed session's own folder, so another omp's subagents in the same folder are never read.
    jsonl: { glob: '{{.omp_sessions}}/{{.state.subagent_rel}}', follow: true }
    mapper: omp.session
    stability: internal
  config:           # model roles for the picker's role chips
    file: { path: '{{.omp_agent}}/config.yml', format: text, follow: true }
    mapper: omp.config
    stability: documented
sources:
  # Chat models of every provider omp can use. omp reads API keys from the
  # login environment (MOONSHOT_API_KEY in .zshrc), which the helper gives
  # the command; the other kinds (local stt/tts/tiny, web search) are not
  # models /switch takes.
  models:
    cli: { argv: [omp, models, ls, --json] }
    select: '[.models[] | select(.kind == "chat")]'
    cache: 1m
    timeout: 10s
    stability: documented
  # The commands come from a second omp started for the question, with the session's own
  # extension, skill and profile options, so it lists what the running omp has: started
  # with --no-extensions for every session, it offered skill commands the session had
  # switched off and missed the commands of an extension loaded with -e (seen on 18.20).
  commands:
    rpc:
      method: get_available_commands
      child: [omp, --mode, rpc, --no-session]
      child_carry:
        values: [--profile, --config, --extension, -e, --trusted-extension, --plugin-dir, --skills, --hook]
        flags: [--no-extensions, --no-skills, --no-rules, --no-context-files]
      framing: typed
    cache: 10m
    timeout: 12s
    stability: documented
  # Providers /login can sign in to, for the picker's "Not set up" section.
  # Ones already signed in, or with models listed, are left out.
  providers:
    rpc: { method: get_login_providers, child: [omp, --mode, rpc, --no-session, --no-extensions], framing: typed }
    select: '[.providers[] | select(.available != false and (.authenticated | not))]'
    cache: 1m
    timeout: 12s
    stability: internal
  settings:
    cli: { argv: [omp, config, list, --json] }
    cache: 1m
    timeout: 8s
    stability: documented
  # `omp ps` respawns its broker when it is gone, which can take ~10 s. A
  # global service's row id is global:<scope>:<name>, so Stop can name its
  # scope; a project's is the process name `omp ps stop` takes.
  jobs:
    cli: { argv: [omp, ps, --json] }
    select: '[.[] | . as $p | .daemons[]? | . + {rowId: (if $p.kind == "global" then "global:" + (($p.scope // $p.name // "") | tostring) + ":" + .name else .name end)}]'
    cache: 5s
    timeout: 15s
    stability: documented
screens:
  model:
    primitive: picker
    title: Model
    section: composer
    capability: model
    source: models
    search: true
    map:
      item.id: .selector
      item.title: .name
      item.group: .provider
      item.subtitle: '{{.contextWindow | tokens}} context'
      item.badge: '{{if .reasoning}}reasoning{{end}}'
      selected: $state.model
    filters:
      - { id: provider, label: Provider, kind: choice, field: provider }
      - { id: reasoning, label: Reasoning, kind: toggle, field: reasoning }
      # A facet named after a role action is "true" on the model that holds the role.
      - { id: set_role_default, label: Default, kind: toggle, field: 'selector == $state.role_model_default' }
      - { id: set_role_smol, label: Smol, kind: toggle, field: 'selector == $state.role_model_smol' }
      - { id: set_role_slow, label: Slow, kind: toggle, field: 'selector == $state.role_model_slow' }
      - { id: set_role_plan, label: Plan, kind: toggle, field: 'selector == $state.role_model_plan' }
    on_select: switch_model
    actions: [set_role_default, set_role_smol, set_role_slow, set_role_plan]
    setup: { source: providers, map: { item.id: .id, item.title: .name }, action: login }
  effort:
    primitive: settings
    title: Effort
    section: composer
    capability: effort
    # The levels the active model takes, from `omp models ls` (its thinking list); a
    # model without one has no adjustable thinking, and /effort refuses any level
    # (seen on 18.20 with apple/on-device). The fixed list is for when the models
    # cannot be read.
    source: models
    fields:
      - id: effort
        label: Effort
        kind: choice
        value: $state.effort
        options: [off, minimal, low, medium, high, xhigh, max, auto]
        options_from: 'first(.[] | select(.selector == $state.model)) | if .thinking == null then [] else ["off"] + .thinking + ["auto"] end'
        none: This model has no adjustable thinking level.
        action: set_effort
  compaction:
    primitive: settings
    title: Compaction
    section: status
    capability: compact
    source: settings
    fields:
      - { id: enabled, label: Compact automatically, kind: toggle, value: '.["compaction.enabled"].value', action: set_compaction_enabled }
      - { id: threshold, label: Threshold percent, kind: number, value: '.["compaction.thresholdPercent"].value', action: set_compaction_threshold, help: '-1 uses the reserve based default' }
    actions: [snapcompact]
  jobs:
    primitive: liveList
    title: Jobs
    section: background
    capability: background
    source: jobs
    map: { item.id: .rowId, item.title: .name, item.subtitle: '.command // .state // empty', item.state: '.state // empty' }
actions:
  # /switch is omp's session-only model change (roles stay as they are;
  # "Default" below sets the role new sessions start with). omp writes no
  # session file before the first turn, so the switch is confirmed from
  # the pane's "Session-only model: <id>." line too; a switch that does
  # not show fails, so the app never says a model is in use when it isn't.
  switch_model:
    label: Use for this session
    type: { text: '/switch {{.id}}', submit: true, when_idle: true }
    verify: { source: session, select: .model, equals: '{{.id}}', within: 6s, required: true }
    stability: documented-command
  # omp's own sign-in: it opens the provider's page through BROWSER, which
  # reaches the phone as browser.open and its sign-in sheet.
  login:
    label: Sign in
    type: { text: '/login {{.id}}', submit: true, when_idle: true }
    stability: documented-command
  set_role_default:
    label: Default
    confirm: Use this model by default in new omp sessions?
    branch:
      - when: '{{.state.roles_without_default}}'
        cli: { argv: [omp, config, set, modelRoles, '{{.state.roles_without_default}}"default":{{printf "%s%s" .id (.state.role_level_default | default "") | json}}}'] }
    verify: { source: config, select: .role_model_default, equals: '{{.id}}', within: 3s }
    stability: documented
  set_role_smol:
    label: Smol
    confirm: Use this model for the smol role?
    branch:
      - when: '{{.state.roles_without_smol}}'
        cli: { argv: [omp, config, set, modelRoles, '{{.state.roles_without_smol}}"smol":{{printf "%s%s" .id (.state.role_level_smol | default "") | json}}}'] }
    verify: { source: config, select: .role_model_smol, equals: '{{.id}}', within: 3s }
    stability: documented
  set_role_slow:
    label: Slow
    confirm: Use this model for the slow role?
    branch:
      - when: '{{.state.roles_without_slow}}'
        cli: { argv: [omp, config, set, modelRoles, '{{.state.roles_without_slow}}"slow":{{printf "%s%s" .id (.state.role_level_slow | default "") | json}}}'] }
    verify: { source: config, select: .role_model_slow, equals: '{{.id}}', within: 3s }
    stability: documented
  set_role_plan:
    label: Plan
    confirm: Use this model for the plan role?
    branch:
      - when: '{{.state.roles_without_plan}}'
        cli: { argv: [omp, config, set, modelRoles, '{{.state.roles_without_plan}}"plan":{{printf "%s%s" .id (.state.role_level_plan | default "") | json}}}'] }
    verify: { source: config, select: .role_model_plan, equals: '{{.id}}', within: 3s }
    stability: documented
  set_effort:
    type: { text: '/effort {{.value}}', submit: true, when_idle: true }
    # Required: omp refuses a level the model does not take, and the app must not
    # say it was set.
    verify: { source: session, select: .effort, equals: '{{.value}}', within: 5s, required: true }
    stability: documented-command
  # `omp config set` writes the user's config. A project's .omp settings win over it,
  # so the value in effect is read back: a change a project overrides is not "applied"
  # (seen on 18.20: enable returned applied and the setting stayed off).
  set_compaction_enabled:
    cli: { argv: [omp, config, set, compaction.enabled, '{{.value}}'] }
    verify: { source: settings, select: '.["compaction.enabled"].value', equals: '{{.value}}', within: 3s, required: true,
      otherwise: 'Saved to your omp settings, but a setting in this project overrides it, so nothing changed here.' }
    stability: documented
  set_compaction_threshold:
    cli: { argv: [omp, config, set, compaction.thresholdPercent, '{{.value}}'] }
    verify: { source: settings, select: '.["compaction.thresholdPercent"].value', equals: '{{.value}}', within: 3s, required: true,
      otherwise: 'Saved to your omp settings, but a setting in this project overrides it, so nothing changed here.' }
    stability: documented
  snapcompact:
    label: Snapcompact
    confirm: Compact with snapcompact now?
    type: { text: '/compact snapcompact', submit: true, when_idle: true }
    stability: documented-command
  compact:
    label: Compact
    confirm: Compact the session now?
    type: { text: '/compact', submit: true, when_idle: true }
    stability: documented-command
  # A resume restarts omp on the chosen conversation with the options the session was
  # started with (its profile, model, tools, folders, approval mode). Options that pick
  # a conversation or run once (--resume, --continue, --fork, --print, a prompt) are
  # never carried.
  resume:
    relaunch:
      argv: [omp, --resume, '{{.id}}']
      carry:
        values: [--profile, --cwd, --config, --add-dir, --provider, --model, --models, --service-tier,
          --api-key, --system-prompt, --system-prompt-template, --append-system-prompt, --session-dir,
          --tools, --thinking, --hook, --extension, -e, --trusted-extension, --plugin-dir, --skills,
          --approval-mode, --max-time, --warn-cost, --max-cost]
        flags: [--smol, --slow, --allow-home, --no-tools, --no-lsp, --no-pty, --hide-thinking,
          --external-thinking, --prewalk, --no-prewalk, --no-extensions, --no-skills, --no-rules,
          --no-context-files, --no-title, --auto-approve, --yolo]
    stability: documented
  # The ask tool's dialog (❯ ○ rows, ☐ boxes for a multi-select, "Other
  # (type your own)", a Review page for a batch; seen on 18.16.0) is driven
  # with keys and read back after every step; the toolResult closes the item.
  answer:
    builtin: screen_answer
    stability: documented
  interrupt:
    keys: { keys: [Escape], until: idle, max: 2 }
    stability: documented
  stop:
    label: Stop
    role: destructive
    branch:
      - when: '{{if eq (part ":" 0 .target) "global"}}true{{end}}'
        cli: { argv: [omp, ps, stop, '{{part ":" 2 .target}}', '--global={{part ":" 1 .target}}'] }
      - cli: { argv: [omp, ps, stop, '{{.target}}'] }
    stability: documented
status:
  actions: [snapcompact]   # inline on the context meter
commands:
  # The native pickers for omp's own commands; the rest come from omp.
  static:
    - { name: model, hint: '[model]', detail: Choose the model, kind: picker, screen: model }
    - { name: effort, hint: '[level]', detail: Set reasoning effort, screen: effort }
    - { name: compact, hint: '[mode]', detail: Compact the session, action: compact }
  source: commands
  select: '[.commands[] | {name: .name, detail: .description, hint: .input.hint, aliases: .aliases, source: .source, subcommands: [.subcommands[]? | {name: .name, detail: .description, hint: .usage}]}]'
  # What each of omp's commands does when run, read from omp 18.20's source
  # (slash-commands/builtin-*.ts and the handlers they call). A command with
  # no entry is not known ahead: an extension's, or one whose handler was
  # not read. They apply to omp's own command list, which the companion
  # publishes from the running program; omp's RPC list leaves out every
  # command that only works on its interactive screen (/resume, /new, ...).
  intents:
    'source:skill': { opens: turn, args: optional }
    # Run on omp 18.20 in an isolated session (their source is not in the
    # research copy): each sends the command to the model as a prompt.
    call-graph: { opens: turn }
    definition: { opens: turn }
    find: { opens: turn }
    green: { opens: turn }
    index: { opens: turn }
    init: { opens: turn }
    peek: { opens: turn }
    pr-impact: { opens: turn }
    reindex: { opens: turn }
    search: { opens: turn }
    visualize: { opens: turn }
    # Needs a git repository; outside one it only says so.
    commit: { opens: turn }
    # Each opens a chooser of what to review or annotate.
    review: { opens: picker }
    annotate: { opens: picker }
    autoresearch: { opens: toggle, args: optional }
    # A list of debug tools; several act on the Mac (open a folder, a flamegraph).
    debug: { opens: picker }
    # Opens the Mac's $VISUAL or $EDITOR: nothing a phone can show.
    local: { opens: action }
    switch: { opens: picker, with_args: action, args: optional }
    effort: { opens: picker, with_args: toggle, args: optional }
    context: { opens: screen, args: none, screen: context }
    login: { opens: signin, with_args: action, args: optional }
    resume: { opens: picker, with_args: action, args: optional }
    model: { opens: screen, args: none, screen: model }
    loop: { opens: toggle, with_args: turn, args: optional }
    goal: { opens: input, with_args: turn, args: optional }
    security: { opens: text, with_args: action, args: optional, destructive: true }
    settings: { opens: settings, args: none }
    setup: { opens: signin, with_args: text, args: optional }
    plan: { opens: toggle, with_args: turn, args: optional }
    plan-review: { opens: input, args: none }
    vibe: { opens: toggle, with_args: turn, args: optional }
    guided-goal: { opens: turn, args: optional }
    queue: { opens: text, with_args: action, args: optional }
    fast: { opens: toggle, args: optional }
    slow: { opens: toggle, args: optional }
    skillful: { opens: toggle, args: optional }
    extended-context: { opens: toggle, args: optional }
    computer: { opens: toggle, args: optional }
    ratchet: { opens: turn, args: optional, destructive: true }
    prewalk: { opens: action, args: optional }
    modelpreset: { opens: picker, with_args: action, args: optional, destructive: true }
    advisor: { opens: toggle, args: optional }
    export: { opens: action, args: optional }
    trace: { opens: action, args: none }
    dump: { opens: action, args: optional }
    share: { opens: action, args: none, destructive: true }
    collab: { opens: action, args: optional, destructive: true }
    join: { opens: text, with_args: action, args: required }
    leave: { opens: action, args: none }
    browser: { opens: toggle, args: optional }
    copy: { opens: picker, with_args: action, args: optional }
    open: { opens: action, args: optional }
    todo: { opens: text, with_args: action, args: optional, destructive: true }
    session: { opens: text, with_args: action, args: optional, destructive: true }
    jobs: { opens: text, with_args: action, args: optional, destructive: true }
    usage: { opens: screen, with_args: picker, args: optional, destructive: true, screen: usage }
    stats: { opens: text, args: optional }
    changelog: { opens: text, args: optional }
    hotkeys: { opens: text, args: none }
    tools: { opens: text, args: none }
    extensions: { opens: screen, args: none, screen: extensions }
    agents: { opens: screen, args: none, screen: agents }
    git: { opens: screen, args: optional, destructive: true, screen: git }
    hub: { opens: screen, args: none, screen: hub }
    branch: { opens: picker, args: none }
    fork: { opens: action, args: optional }
    tree: { opens: picker, args: none }
    logout: { opens: picker, args: optional, destructive: true }
    mcp: { opens: text, with_args: action, args: optional, destructive: true }
    ssh: { opens: text, with_args: action, args: optional, destructive: true }
    new: { opens: action, args: none }
    fresh: { opens: action, args: none }
    clear: { opens: action, args: none, destructive: true }
    delete: { opens: action, args: none, destructive: true }
    compact: { opens: action, args: optional, destructive: true }
    shake: { opens: action, args: optional, destructive: true }
    handoff: { opens: action, args: optional, destructive: true }
    seance: { opens: picker, with_args: action, args: optional }
    pin: { opens: toggle, args: optional }
    unpin: { opens: action, args: optional }
    btw: { opens: picker, with_args: turn, args: optional }
    tan: { opens: text, with_args: action, args: required }
    omfg: { opens: text, with_args: turn, args: required }
    cleanse: { opens: picker, with_args: turn, args: optional, destructive: true }
    retry: { opens: action, args: none }
    memory: { opens: text, with_args: action, args: optional, destructive: true }
    rename: { opens: action, args: optional }
    move: { opens: input, with_args: action, args: optional }
    wt: { opens: action, args: optional, destructive: true }
    add-dir: { opens: text, with_args: action, args: required }
    remove-dir: { opens: text, with_args: action, args: required }
    dirs: { opens: text, args: none }
    exit: { opens: exit, args: none, destructive: true }
    restart: { opens: exit, args: none, destructive: true }
    marketplace: { opens: picker, with_args: action, args: optional, destructive: true }
    plugins: { opens: text, with_args: action, args: optional }
    reload-plugins: { opens: action, args: none }
    skills: { opens: text, with_args: action, args: optional, destructive: true }
    force: { opens: text, with_args: turn, args: required }
    live: { opens: toggle, args: none }
    record: { opens: toggle, args: none }
    pause: { opens: screen, args: none, screen: pause }
    forget-approvals: { opens: action, args: none, destructive: true }
    quit: { opens: exit, args: none, destructive: true }
    status: { opens: screen, with_args: unknown, args: optional, screen: status }
mission:
  background: { source: jobs, refresh: 10s, map: { item.id: .rowId, item.title: .name, item.subtitle: '.command // .state // empty' } }
