# Kimi Code 2.x. No attach protocol for the TUI (`kimi acp` is stdio, `kimi web` a separate
# server), so reads come from the main agent's wire log and writes go through relaunch
# flags and typed commands. Checked on 2.0.2 against the owner's sessions (protocol 1.4
# and 1.5): sessions live in ~/.kimi-code/sessions/wd_<name>_<sha256(cwd)[:12]>/, and
# `kimi session list --json --cwd` lists them. Subagents and background tasks are read
# from the main log (Agent calls, task ids, completion notices), not their own files.
adapter: kimi
name: Kimi Code
revision: 1
match: { agents: [kimi], commands: [kimi] }
harness: { version: [kimi, --version], pattern: '(\d+\.\d+\.\d+)', range: ">=2.0 <3" }
capabilities: [chat, chat.anchors, chat.history, send.queue, interrupt, commands, files, mode, model,
  agents, background, plan, changes, status, resume, compact, needs.approvals, needs.questions]
feeds:
  wire:
    # exclusive: follow only a file this session's own agent process holds open (a /new moves it,
    # the old file is dropped); a file another process holds is never taken; with no evidence the
    # session keeps its file.
    jsonl: { glob: '~/.kimi-code/sessions/wd_*_{{slice (sha256 .cwd) 0 12}}/session_*/agents/main/wire.jsonl', follow: true, exclusive: true }   # every session of a cwd shares the folder
    mapper: kimi.wire
    stability: internal
sources:
  sessions:
    cli: { argv: [kimi, session, list, --json, --limit, '50', --cwd, '{{.cwd}}'] }
    cache: 30s
    stability: documented
  # The config also holds provider keys; only model names are selected, and
  # the engine strips secret-named keys before the select runs.
  models:
    file: { path: '~/.kimi-code/config.toml', format: toml }
    select: '[.models // {} | to_entries[] | {id: .key, name: (.value.display_name // .key), context: .value.max_context_size}]'
    cache: 1m
    stability: documented
screens:
  model:
    primitive: picker
    title: Model
    section: composer
    capability: model
    source: models
    search: true
    map: { item.id: .id, item.title: .name, item.subtitle: '{{.context | tokens}} context', selected: $state.model }
    on_select: set_model
  resume:
    primitive: picker
    title: Resume
    section: more
    capability: resume
    source: sessions
    search: true
    map: { item.id: .id, item.title: '{{.title | truncate 60}}', item.subtitle: '{{.updatedAt | ago}}' }
    on_select: resume
actions:
  set_model:
    label: Use model
    confirm: Restart Kimi with this model? The conversation continues.
    relaunch: { argv: [kimi, -m, '{{.id}}', --continue] }
    stability: documented
  set_mode:
    label: Mode
    confirm: Change Kimi's mode? Some modes restart Kimi; the conversation continues.
    # /plan toggles plan mode in place (Kimi 2.5). A relaunch cannot leave plan
    # mode: `kimi --continue` restores it with the session (seen live).
    branch:
      - { when: '{{and (eq .id "plan") (ne .state.mode "plan")}}', type: { text: /plan, submit: true, when_idle: true } }
      - { when: '{{and (eq .id "default") (eq .state.mode "plan")}}', type: { text: /plan, submit: true, when_idle: true } }
      - { when: '{{eq .id "plan"}}', relaunch: { argv: [kimi, --plan, --continue] } }
      - { when: '{{eq .id "yolo"}}', relaunch: { argv: [kimi, --yolo, --continue] } }
      - { when: '{{eq .id "auto"}}', relaunch: { argv: [kimi, --auto, --continue] } }
      - { relaunch: { argv: [kimi, --continue] } }
    stability: documented
  compact:
    confirm: Compact the conversation now?
    type: { text: '/compact', submit: true, when_idle: true }
    stability: unverified
  resume:
    relaunch: { argv: [kimi, --session, '{{.id}}'] }
    stability: documented
  interrupt:
    keys: { keys: [Escape] }
    stability: documented
  # Prompts are logged as interaction.request (kind question or approval) and answered in the
  # TUI only, so the answer is keys. Approvals (ids approval_…: a tool's Approve once / for this
  # session / Reject, or a plan's Approve / Reject / Revise) are numbered menus the screen
  # watcher reads with these labels: one pick through that prompt. Questions (ids question_…:
  # `→ [1] Label` rows with descriptions, `[ ]/[✓]` for multi-select, Other, a tab strip and a
  # "Ready to submit your answers?" page) go through the shared dialog driver. Seen on 2.5.3.
  answer:
    branch:
      - { when: '{{eq (part "_" 0 .target) "approval"}}', builtin: approval_answer }
      - { builtin: screen_answer }
    stability: experimental
modes:
  choices:
    - { id: default, label: Ask }
    - { id: yolo, label: Ask when needed }
    - { id: auto, label: Never ask }
    - { id: plan, label: Plan }
  select: $state.mode
  set: set_mode
status:
  actions: [compact]   # inline on the context meter
commands:
  static:
    - { name: compact, detail: Summarise the conversation, action: compact }
    - { name: model, detail: Choose the model, kind: picker, screen: model }
    - { name: sessions, detail: Resume a session, screen: resume }
