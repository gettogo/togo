# Cline CLI 3.x. No documented attach for the TUI (the hub daemon's protocol is undocumented,
# `--acp` is a separate stdio agent). Sessions: `cline history --json` (documented; not run, the
# owner's 3.0.62 hangs on every invocation, `cline version` and `--version` included, even with
# stdin closed, so the gate fails and the session stays terminal-only on that build). Writes:
# resume relaunches with --id. Model, thinking and mode relaunches are not offered: they need
# the session id, and nothing reads it (hooks under ~/.cline/hooks/ are not read: their payload
# was not seen). There is no MCP list command.
adapter: cline
name: Cline
revision: 1
match: { agents: [cline], commands: [cline] }
harness: { version: [cline, version], pattern: '(\d+\.\d+\.\d+)', range: ">=3.0 <4" }
capabilities: [interrupt, commands, changes, ports, resume]
sources:
  sessions:
    cli: { argv: [cline, history, --json, --limit, '50'] }
    select: '[(.sessions? // .)[] | {id: .id, title: (.title // .prompt // .task // .id), updated: (.updatedAt // .updated_at // .ts // null)}]'
    cache: 30s
    timeout: 10s
    stability: experimental
screens:
  resume:
    primitive: picker
    title: Resume
    section: more
    capability: resume
    source: sessions
    search: true
    map: { item.id: .id, item.title: '{{.title | truncate 60}}', item.subtitle: '{{.updated | ago}}' }
    on_select: resume
actions:
  resume:
    label: Resume
    relaunch: { argv: [cline, -i, --id, '{{.id}}'] }
    stability: documented
  interrupt:
    keys: { keys: [Escape] }
    stability: experimental
commands:
  static:
    - { name: resume, detail: Resume a session, screen: resume }
