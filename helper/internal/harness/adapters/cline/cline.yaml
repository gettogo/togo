# Cline CLI 3.0.74. No documented attach for the TUI (the hub daemon's websocket protocol is
# undocumented, `--acp` is a separate stdio agent). Reads: the session messages file
# ~/.cline/data/sessions/<id>/<id>.messages.json, rewritten whole after each assistant message and
# loop iteration, and its manifest <id>.json (cwd, start, model, mode); layout read from the
# installed CLI's bundled source, no live session was made. The newest messages file whose
# manifest works in this folder and started (or changed) since the session began is followed; a
# `--id` launch follows that id. Writes: resume relaunches with --id; prompts are typed. Model,
# thinking and mode relaunches are not offered yet. There is no MCP list command. A failed run
# (provider refused, unreachable, unknown model) appends a display-only assistant message with
# metadata.displayRole error (recordTerminalError, read from real failed runs): it maps to an
# error notice and the turn ends failed.
adapter: cline
name: Cline
revision: 1
match: { agents: [cline], commands: [cline] }
harness: { version: [cline, version], pattern: '(\d+\.\d+\.\d+)', range: ">=3.0.74 <4" }
capabilities: [chat, send.queue, interrupt, commands, needs.approvals, needs.questions, changes, ports, resume]
feeds:
  sessions:         # finds this session's file; the mapper checks the manifest next to it
    file: { glob: '~/.cline/data/sessions/*/*.messages.json', format: json, follow: true }
    mapper: cline.messages
    stability: internal
  messages:         # path: set by the mapper once it knows the session id
    file: { path: '{{.state.transcript_path}}', format: json, follow: true }
    mapper: cline.messages
    stability: internal
sources:
  sessions:
    cli: { argv: [cline, history, --json, --limit, '50'] }
    select: '[(.sessions? // .)[] | {id: (.sessionId // .id), title: (.title // .prompt // .task // .sessionId // .id), updated: (.updatedAt // .updated_at // .ts // null)}]'
    cache: 30s
    timeout: 10s
    stability: experimental
screens:
  resume:
    primitive: picker
    title: Resume
    section: more
    capability: resume
    source: sessions
    search: true
    map: { item.id: .id, item.title: '{{.title | truncate 60}}', item.subtitle: '{{.updated | ago}}' }
    on_select: resume
actions:
  resume:
    label: Resume
    relaunch: { argv: [cline, -i, --id, '{{.id}}'] }
    stability: documented
  answer:            # question items: keys on the dialog drawn (detect.ParseChoice)
    builtin: screen_answer
    stability: experimental
  interrupt:
    keys: { keys: [Escape] }
    stability: experimental
commands:
  static:
    - { name: resume, detail: Resume a session, screen: resume }
