# Kilo Code CLI 7.x, an OpenCode fork. Togo starts the TUI with `--port N`; the TUI
# serves a superset of OpenCode's HTTP API and the same /event stream on 127.0.0.1:N,
# so this file is OpenCode's with Kilo's ids, agents and version, and it uses the
# opencode.events mapper unchanged. Checked on Kilo 7.8.27 (`kilo serve --pure`):
# every path and request body below is in its /doc, the event types the mapper reads
# are all declared there, and a recorded session's events map as OpenCode's do.
adapter: kilo
name: Kilo Code
revision: 1
match: { agents: [kilo], commands: [kilo, kilocode] }
harness: { version: [kilo, --version], pattern: '^(\d+\.\d+\.\d+)', range: ">=7.8 <8" }
# Kilo 7.8 guards the TUI's server with Basic auth even on loopback (401 without
# it, seen live); the password comes from KILO_SERVER_PASSWORD, user "kilo".
endpoint: { kind: http, launch_args: [--port, '{{.port}}'], health: /path, password_env: KILO_SERVER_PASSWORD, username: kilo }
capabilities: [chat, chat.stream, chat.anchors, send.api, send.queue, interrupt, commands,
  files, mode, model, needs.approvals, needs.questions, agents, plan, changes, ports, status,
  status.context, resume, compact, mcp, settings]
feeds:
  events:
    sse: { path: /event }
    mapper: opencode.events
    stability: documented
sources:
  sessions:
    http: { path: /session }
    select: '[.[] | select(.parentID == null)] | sort_by(-.time.updated)'
    cache: 30s
    stability: documented
  # /config/providers returns provider keys in plain text (`key`, `options.apiKey`,
  # `options.headers`). The http runner strips them before anything else reads the
  # answer and lists the stripped names in `_set`; these paths remove them again.
  models:
    http: { path: /config/providers }
    redact: ['.providers[].key', '.providers[].options.apiKey', '.providers[].options.headers']
    # An item id is the ModelRef the session model switch takes, as compact
    # JSON with sorted keys; the mapper reports the current one as model_ref.
    select: '[.providers[] | .id as $p | .name as $pn | .models[] | {id: ({id: .id, providerID: $p} | tojson), name: .name, provider: $p, providerName: $pn}]'
    cache: 5m
    stability: documented
  providers:
    http: { path: /config/providers }
    redact: ['.providers[].key', '.providers[].options.apiKey', '.providers[].options.headers']
    select: '[.providers[] | {id: .id, name: .name, keySet: ((((._set // []) | index("key")) != null) or (((.options._set // []) | index("apiKey")) != null))}]'
    cache: 5m
    stability: documented
  # Every provider the harness knows, less the connected ones: the model
  # picker's "Not set up" section, where an API key connects one.
  unconnected:
    http: { path: /provider }
    redact: ['.all[].key', '.all[].options.apiKey', '.all[].options.headers']
    select: '.connected as $c | [.all[] | select(.id as $id | $c | index($id) | not) | {id: .id, name: .name}] | sort_by(.name | ascii_downcase)'
    cache: 5m
    stability: documented
  agents:
    http: { path: /agent }
    select: '[.[] | select(.mode != "subagent")]'
    cache: 5m
    stability: documented
  commands:
    http: { path: /command }
    cache: 5m
    stability: documented
  todo:
    http: { path: '/session/{{.state.harness_session}}/todo' }
    stability: documented
  children:
    http: { path: '/session/{{.state.harness_session}}/children' }
    stability: documented
  diff:
    http: { path: '/session/{{.state.harness_session}}/diff' }
    stability: documented
  mcp:
    http: { path: /mcp }
    select: '[to_entries[] | {id: .key, title: .key, state: .value.status}]'
    cache: 30s
    stability: documented
screens:
  model:
    primitive: picker
    title: Model
    section: composer
    capability: model
    source: models
    search: true
    map: { item.id: .id, item.title: .name, item.group: .providerName, selected: $state.model_ref }
    filters: [{ id: provider, label: Provider, kind: choice, field: provider }]
    on_select: set_model
    setup: { source: unconnected, map: { item.id: .id, item.title: .name }, action: add_provider_key, input: secret }
  providers:
    primitive: settings
    title: Providers
    section: more
    capability: settings
    source: providers
    fields:
      # A secret field never carries a value; keySet only says one exists.
      - { id: key, label: API key, kind: secret, value: .keySet, action: set_provider_key }
  resume:
    primitive: picker
    title: Resume
    section: more
    capability: resume
    source: sessions
    search: true
    map: { item.id: .id, item.title: .title, item.subtitle: '{{.time.updated | ago}}' }
    on_select: resume
  mcp:
    primitive: liveList
    title: MCP servers
    section: more
    capability: mcp
    source: mcp
actions:
  # These switch the live session (checked: no config file is written). The
  # TUI keeps its own choice for prompts typed at the desk, and its footer
  # shows that choice: the API changes the server session's agent, which the
  # TUI reads only after a turn (seen live). The TUI's only agent control is
  # its cycle key, which cannot name an agent, so the footer is not driven;
  # Togo's mode chip shows the pick at once. OpenCode 2.x's footer follows.
  set_model:
    http: { method: POST, path: '/api/session/{{.state.harness_session}}/model', body: '{"model": {{.id | object}}}' }
    stability: experimental
  set_mode:
    http: { method: POST, path: '/api/session/{{.state.harness_session}}/agent', body: '{"agent": {{.id | json}}}' }
    stability: experimental
  add_provider_key:
    label: Add key
    http: { method: PUT, path: '/auth/{{.id}}', body: '{"type": "api", "key": {{.value | json}}}' }
    stability: documented
  set_provider_key:
    http: { method: PUT, path: '/auth/{{.target}}', body: '{"type": "api", "key": {{.value | json}}}' }
    stability: documented
  # A / line from the composer or the palette runs as the server's command
  # (`/init`, user commands), never as prompt text the model would read.
  command:
    http: { method: POST, path: '/session/{{.state.harness_session}}/command', body: '{"command": {{.command | json}}, "arguments": {{.arguments | json}}}' }
    stability: documented
  send:
    http: { method: POST, path: '/session/{{.state.harness_session}}/prompt_async', body: '{"parts": [{"type": "text", "text": {{.text | json}}}]}' }
    stability: documented
  resume:
    http: { method: POST, path: /tui/select-session, body: '{"sessionID": {{.id | json}}}' }
    stability: documented
  compact:
    confirm: Compact the session now?
    http: { method: POST, path: '/session/{{.state.harness_session}}/summarize', body: '{"providerID": {{.state.provider | json}}, "modelID": {{.state.model_id | json}}}' }
    stability: documented
  interrupt:
    http: { method: POST, path: '/session/{{.state.harness_session}}/abort' }
    stability: documented
  # Questions and permissions both arrive as question items. A permission's
  # item id starts with per_, its one question is "0" and its options are
  # once, always and reject; a question's ids are "0", "1"... in order and its
  # option ids are the option labels Kilo expects back.
  answer:
    branch:
      - when: '{{if eq (slice .target 0 4) "per_"}}true{{end}}'
        http: { method: POST, path: '/permission/{{.target}}/reply', body: '{"reply": {{index (index .answers "0") 0 | json}}}' }
      # One slot per question, in order, [] for one left unanswered.
      - http: { method: POST, path: '/question/{{.target}}/reply', body: '{"answers": {{slots .answers}}}' }
    stability: documented
  stop:
    role: destructive
    http: { method: POST, path: '/session/{{.target}}/abort' }
    stability: documented
modes:
  choices:
    - { id: code, label: Code }
    - { id: plan, label: Plan }
    - { id: ask, label: Ask }
    - { id: debug, label: Debug }
    - { id: orchestrator, label: Orchestrator }
  current: agents
  select: $state.mode
  set: set_mode
commands:
  # The TUI's own pickers open natively; the server's commands (with an
  # argument when the template takes one) run through the command action.
  static:
    - { name: models, detail: Choose the model, screen: model }
    - { name: sessions, detail: Resume a session, screen: resume }
    - { name: compact, detail: Summarise the session, action: compact }
  source: commands
  select: '[.[] | {name: .name, detail: .description, hint: (if ((.hints // []) | length) > 0 then "<arguments>" else "" end)}]'
mission:
  plan: { source: todo }
  agents: { source: children }
