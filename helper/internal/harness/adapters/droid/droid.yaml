# Factory Droid 1.5. No attach protocol for the TUI (`droid daemon` and `droid exec
# --output-format acp|stream-jsonrpc` host their own sessions). Reads: Claude-shaped hooks
# (documented; not yet seen live, the owner has not logged in), which also draw the chat.
# Writes: typed slash commands that take arguments (`/compress`, `/resume <id>`); the model has
# no typed argument form and the interactive CLI no --model flag, so it stays in the terminal.
# The session folder layout is unverified.
adapter: droid
name: Droid
revision: 1
match: { agents: [droid], commands: [droid] }
harness: { version: [droid, --version], pattern: '^(\d+\.\d+\.\d+)', range: ">=1.5 <2" }
# No status capability: the hooks carry no model, usage or context to fill one.
capabilities: [chat, chat.anchors, send.queue, interrupt, commands, files, needs.approvals, agents,
  changes, ports, resume, compact]
feeds:
  hooks:            # `togo hook droid <event>` in ~/.factory/hooks.json (installed only by `togo hooks install --agent droid`)
    hook:
      events: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Notification, Stop,
        SubagentStop, PreCompact, SessionEnd]
    mapper: droid.hooks
    stability: documented
sources:
  sessions:         # layout unverified: one folder per project, one JSONL per session
    file: { glob: '~/.factory/sessions/*/*.jsonl', format: jsonl }
    select: '[.[] | select((.head[0].cwd // "") == $state.cwd or (.head[0].cwd // "") == "") | {id: .name, title: (.head[0].title // null), updated: .mtime}]'
    cache: 30s
    stability: internal
screens:
  resume:
    primitive: picker
    title: Resume
    section: more
    capability: resume
    source: sessions
    search: true
    map: { item.id: .id, item.title: '{{.title | default .id | truncate 60}}', item.subtitle: '{{.updated | ago}}' }
    on_select: resume
actions:
  # Droid asks "compress now?" itself after /compress, so Togo asks nothing
  # first: one confirmation, Droid's, which the prompt detector brings to
  # the phone.
  compact:
    label: Compress
    type: { text: '/compress', submit: true, when_idle: true }
    stability: documented-command
  resume:
    label: Resume
    branch:
      - { when: '{{.state.idle}}', type: { text: '/resume {{.id}}', submit: true, when_idle: true } }
      - { relaunch: { argv: [droid, --resume, '{{.id}}'] } }
    verify: { source: hooks, select: $state.harness_session, equals: '{{.id}}', within: 10s }
    stability: documented-command
  answer:
    builtin: approval_answer
    stability: experimental
  interrupt:
    keys: { keys: [Escape], until: idle, max: 2 }
    stability: documented
status:
  actions: [compact]   # inline on the context meter, once a status block exists
commands:
  static:
    - { name: model, detail: Open the model selector, kind: terminal }
    - { name: compress, detail: Compress the session, action: compact }
    - { name: resume, hint: '[id]', detail: Resume a session, screen: resume }
    - { name: context, detail: Context window usage, kind: terminal }
    - { name: cost, detail: Token usage and cost, kind: terminal }
    - { name: droids, detail: Custom droids (subagents), kind: terminal }
    - { name: review, detail: Review current changes }
