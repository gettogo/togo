# Mistral Vibe 3.1. No attach protocol for the TUI (`vibe-acp` and `vibe-app-server` are separate
# stdio processes). Reads: the recovery journal ~/.vibe/logs/session/unified/<id>/journal/*.jsonl
# (its projection_delta records: the public history entries and the turn's status and error) and
# the snapshot it folds into after each turn, picked by meta.json's working_directory; layout from
# Vibe 3.1.0's local harness, checked against live sessions. Hooks that use Vibe's claude_code
# protocol (pre_tool, post_tool, post_agent; payload unverified) are read when present.
# Writes: built-in agents are the modes and change by relaunch with --continue; /compact typed.
adapter: vibe
name: Mistral Vibe
revision: 1
match: { agents: [vibe], commands: [vibe] }
harness: { version: [vibe, --version], pattern: '(\d+\.\d+\.\d+)', range: ">=3.1 <4" }
capabilities: [chat, chat.anchors, chat.history, send.queue, interrupt, commands, files, mode,
  needs.approvals, needs.questions, changes, ports, resume, compact]
feeds:
  hooks:            # not installed by Togo: Vibe reads claude_code hooks from Claude-format plugins
    hook: { events: [PreToolUse, PostToolUse, Stop] }
    mapper: vibe.hooks
    stability: experimental
  session:          # glob: the segments of the newest session whose meta.json works in this folder
    jsonl: { glob: '{{.state.transcript_path}}', follow: true }
    mapper: vibe.session
    stability: internal
sources:
  sessions:
    file: { glob: '~/.vibe/logs/session/unified/*/meta.json', format: json }
    select: '[.[] | .head[0] as $m | select($m.parent_session_id == null) | select(($m.environment.working_directory // "") == $state.cwd or ($m.origin_directory // "") == $state.cwd) | {id: $m.session_id, title: $m.title, updated: .mtime}]'
    cache: 30s
    stability: internal
  config:
    file: { path: '~/.vibe/config.toml', format: toml }
    select: '{default_agent: (.default_agent // "accept-edits"), active_model: .active_model}'
    stability: documented
screens:
  resume:
    primitive: picker
    title: Resume
    section: more
    capability: resume
    source: sessions
    search: true
    map: { item.id: .id, item.title: '{{.title | default .id | truncate 60}}', item.subtitle: '{{.updated | ago}}' }
    on_select: resume
actions:
  set_mode:
    label: Agent
    confirm: Restart Vibe with this agent? The session continues.
    relaunch: { argv: [vibe, --agent, '{{.id}}', --continue] }
    stability: documented
  compact:
    label: Compact
    confirm: Compact the conversation now?
    type: { text: '/compact', submit: true, when_idle: true }
    stability: documented-command
  resume:
    label: Resume
    relaunch: { argv: [vibe, --resume, '{{.id}}'] }
    stability: documented
  answer:            # question items: keys on the dialog drawn (detect.ParseChoice)
    builtin: screen_answer
    stability: experimental
  interrupt:
    keys: { keys: [Escape] }
    stability: documented
modes:
  choices:
    - { id: ask, label: Ask }
    - { id: accept-edits, label: Auto edit }
    - { id: smart-approve, label: Smart }
    - { id: auto-approve, label: YOLO }
  # Vibe records the agent nowhere it can be read (meta.json and the
  # journal hold none, and the config source is not a feed): its footer
  # says it, "… Qwen3.8 27B (5090)[off] · accept edits ─" (3.1.0). A switch
  # from the phone keeps the new one.
  select: $state.mode
  set: set_mode
  screen:
    - { line: '·\s+ask\s*─*\s*$', id: ask }
    - { line: '·\s+accept edits\s*─*\s*$', id: accept-edits }
    - { line: '·\s+smart approve\s*─*\s*$', id: smart-approve }
    - { line: '·\s+auto approve\s*─*\s*$', id: auto-approve }
status:
  actions: [compact]   # inline on the context meter, once a status block exists
commands:
  static:
    - { name: compact, detail: Summarise the conversation, action: compact }
    - { name: config, detail: Settings, kind: terminal }
    - { name: resume, detail: Resume a session, screen: resume }
