# Codex CLI through its app-server. Togo starts `codex app-server --listen unix://SOCK`
# and the TUI with `--remote unix://SOCK`; the helper joins the same server as a
# second client (WebSocket frames over the unix socket), follows every loaded
# thread with thread/resume and receives the same turn and item notifications as
# the TUI. Checked on Codex 0.144.1: a second client's thread/resume on a running
# thread rejoins it (same id, no fork), its turn/interrupt stops the TUI's turn,
# and turn/start overrides from it reach the TUI as thread/settings/updated.
# Checked again on Codex 0.167.0 (live, and its generated app-server schema
# diffed against 0.144.1's): the methods and notifications below are unchanged
# and only gained fields. --listen unix://PATH now leaves a symlink at PATH to a
# socket under /tmp/codex-daemon-<uid>/, which dials the same. Threads are
# "paginated": thread/resume still returns every turn's items (with a
# deprecationNotice), and turn/completed carries only a summary, which the
# mapper does not read. Codex's ephemeral title thread shows up in
# thread/loaded/list but cannot be resumed and never becomes the main thread.
# New since 0.150 and mapped: functionCallOutput items, async agent messages
# with questions, and the cyberPolicy and misalignmentPolicyViolation errors.
# approval_policy "untrusted" is gone: `codex -a` refuses it and a config.toml
# that sets it no longer loads, so the mode picker (which writes config.toml)
# offers only on-request and never. A 0.144 thread still reports untrusted,
# shown as Ask.
adapter: codex
name: Codex
revision: 1
match: { agents: [codex], commands: [codex] }
harness: { version: [codex, --version], pattern: '(\d+\.\d+\.\d+)', range: ">=0.144 <0.168" }
endpoint:
  kind: unix
  server: [codex, app-server, --listen, 'unix://{{.socket}}']
  launch_args: [--remote, 'unix://{{.socket}}']
  health: initialize
capabilities: [chat, chat.stream, chat.anchors, chat.history, send.queue, interrupt, commands, files,
  mode, model, effort, needs.approvals, needs.questions, agents, plan, changes, ports, status,
  status.usage, status.context, resume, compact]
images: { insert: together }   # how image paths are pasted into the input
feeds:
  appserver:
    rpc:
      # No threadId: the feed follows every thread the server loads (the
      # TUI's, its subagents', a /new or /resume) and the mapper picks the
      # top-level one. A threadId from state would hold the feed back until
      # Codex's SessionStart hook ran, and 0.167 runs hooks only once the
      # user trusts them.
      method: thread/resume
      notifications: [thread/status/changed, thread/settings/updated, thread/tokenUsage/updated,
        thread/compacted, turn/started, turn/completed, turn/plan/updated, turn/diff/updated,
        item/started, item/completed, item/agentMessage/delta, item/reasoning/summaryTextDelta,
        item/commandExecution/outputDelta, account/rateLimits/updated, serverRequest/resolved,
        model/rerouted, error]
    mapper: codex.appserver
    stability: experimental
  hooks:
    hook: { events: [SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, PermissionRequest, Stop] }
    mapper: codex.hooks
    stability: documented
sources:
  models:
    rpc: { method: model/list }
    select: '[.data[] | select(.hidden | not)]'
    cache: 10m
    stability: experimental
  efforts:
    rpc: { method: model/list }
    # Before a thread reports its model (a fresh session), the default model's efforts.
    select: '[.data[] | select(if ($state.model // "") == "" then .isDefault else .id == $state.model end) | .supportedReasoningEfforts[]]'
    cache: 10m
    stability: experimental
  threads:
    rpc: { method: thread/list, params: { cwd: '{{.cwd}}' } }
    select: '[.data[] | select(.parentThreadId == null)]'
    cache: 30s
    stability: experimental
screens:
  model:
    primitive: picker
    title: Model
    section: composer
    capability: model
    source: models
    map: { item.id: .id, item.title: .displayName, item.subtitle: .description, selected: $state.model }
    on_select: set_model
  effort:
    primitive: picker
    title: Effort
    section: composer
    capability: effort
    source: efforts
    map: { item.id: .reasoningEffort, item.title: .reasoningEffort, item.subtitle: .description, selected: $state.effort }
    on_select: set_effort
  resume:
    primitive: picker
    title: Resume
    section: more
    capability: resume
    source: threads
    search: true
    map: { item.id: .id, item.title: '{{.name | default .preview | truncate 60}}', item.subtitle: '{{.updatedAt | ago}}' }
    on_select: resume
actions:
  # Codex has no live setter for a running thread: model and effort change
  # through turn/start overrides only, and the TUI sends its own with every
  # turn, so a config.toml write reached only new threads (seen on 0.167.0:
  # the next turn ran on the old model). These restart the TUI on the same
  # thread with -m and a -c override instead, for this session only; the
  # thread and its history carry on. Without a thread yet, a plain restart.
  set_model:
    label: Use model
    confirm: Restart Codex on this model? The thread continues.
    branch:
      - when: '{{if .state.harness_session}}true{{end}}'
        relaunch:
          argv: [codex, resume, '{{.state.harness_session}}', -m, '{{.id}}']
          keep: [[-c, '{{if .state.effort}}model_reasoning_effort={{.state.effort}}{{end}}']]
      - relaunch:
          argv: [codex, -m, '{{.id}}']
          keep: [[-c, '{{if .state.effort}}model_reasoning_effort={{.state.effort}}{{end}}']]
    stability: documented
  set_effort:
    label: Set effort
    confirm: Restart Codex with this effort? The thread continues.
    branch:
      - when: '{{if .state.harness_session}}true{{end}}'
        relaunch:
          argv: [codex, resume, '{{.state.harness_session}}', -c, 'model_reasoning_effort={{.id}}']
          keep: [[-m, '{{.state.model}}']]
      - relaunch:
          argv: [codex, -c, 'model_reasoning_effort={{.id}}']
          keep: [[-m, '{{.state.model}}']]
    stability: documented
  set_mode:
    note: Applies to new threads
    rpc: { method: config/value/write, params: { keyPath: approval_policy, value: '{{.id}}', mergeStrategy: replace } }
    stability: experimental
  resume:
    relaunch: { argv: [codex, resume, '{{.id}}'] }
    stability: documented
  compact:
    confirm: Compact the thread now?
    rpc: { method: thread/compact/start, params: { threadId: '{{.state.harness_session}}' } }
    stability: experimental
  interrupt:
    rpc: { method: turn/interrupt, params: { threadId: '{{.state.harness_session}}', turnId: '{{.state.turn}}' } }
    stability: experimental
  answer:
    builtin: rpc_reply          # answers the pending server request named by target
    stability: experimental
status:
  actions: [compact]   # inline on the context meter
modes:
  choices:
    - { id: on-request, label: Auto }
    - { id: never, label: Full access }
  select: $state.mode
  set: set_mode
commands:
  static:
    - { name: model, detail: Choose model and effort, kind: picker, screen: model }
    - { name: compact, detail: Summarise the thread, action: compact }
    - { name: review, detail: Review current changes }
    - { name: diff, detail: Show the git diff, opens: changes }
    - { name: status, detail: Session and usage, opens: status }
