# Aider 0.86. No structured channel: no JSON output, hooks, server or ACP. Reads: the chat
# history aider appends as markdown to .aider.chat.history.md at the git root (or the folder, or
# --chat-history-file), tailed line by line; only what follows this run's "aider chat started"
# header is mapped (format from io.py, 0.86). Prompts, replies (written whole when they finish),
# edits, commits and shell runs show in the chat; the file has no turn end, so a turn closes at
# the next prompt or when the pane goes idle. Approvals are line prompts the existing prompt
# detector answers. Writes: typed prompts and documented slash commands with arguments.
adapter: aider
name: Aider
revision: 1
match: { agents: [aider], commands: [aider] }
harness: { version: [aider, --version], pattern: 'aider (\d+\.\d+\.\d+)', range: ">=0.86 <0.90" }
capabilities: [chat, send.queue, interrupt, commands, files, mode, model, changes, ports]
feeds:
  history:          # path: worked out from the session folder and argv by the mapper
    jsonl: { path: '{{.state.transcript_path}}', follow: true, format: lines }
    mapper: aider.history
    stability: internal
sources:
  models:           # aliases aider documents for --model and /model
    static:
      - { id: sonnet, label: Claude Sonnet }
      - { id: opus, label: Claude Opus }
      - { id: haiku, label: Claude Haiku }
      - { id: gpt-4o, label: GPT-4o }
      - { id: deepseek, label: DeepSeek }
      - { id: gemini, label: Gemini }
    stability: documented
screens:
  model:
    primitive: picker
    title: Model
    section: composer
    capability: model
    source: models
    search: true
    map: { item.id: .id, item.title: .label }
    on_select: set_model
actions:
  set_model:
    label: Use model
    type: { text: '/model {{.id}}', submit: true, when_idle: true }
    stability: documented-command
  set_mode:
    label: Mode
    type: { text: '/chat-mode {{.id}}', submit: true, when_idle: true }
    stability: documented-command
  undo:
    label: Undo last commit
    role: destructive
    confirm: Undo the last aider commit?
    type: { text: '/undo', submit: true, when_idle: true }
    stability: documented-command
  interrupt:
    keys: { keys: [C-c] }
    stability: documented
modes:
  choices:
    - { id: code, label: Code }
    - { id: architect, label: Architect }
    - { id: ask, label: Ask }
    - { id: help, label: Help }
  set: set_mode
  # Aider's prompt names the chat mode when it is not the model's own edit format
  # ("ask> ", "architect> ", "help> ", "ask multi> "; io.get_input in 0.86): the last
  # prompt on screen is the current one, and a bare "> " is code.
  screen:
    - { line: '^architect( multi)?>( |$)', id: architect }
    - { line: '^ask( multi)?>( |$)', id: ask }
    - { line: '^help( multi)?>( |$)', id: help }
    - { line: '^([a-z-]+)?( multi)?>( |$)', id: code }
commands:
  static:
    - { name: add, hint: '<file>', detail: Add files to the chat }
    - { name: drop, hint: '<file>', detail: Remove files from the chat }
    - { name: model, hint: '<model>', detail: Switch the main model, kind: picker, screen: model }
    - { name: chat-mode, hint: '<mode>', detail: Switch chat mode, kind: choice, action: set_mode }
    - { name: architect, hint: '<message>', detail: Architect mode for one message }
    - { name: ask, hint: '<message>', detail: Ask without editing }
    - { name: diff, detail: Diff since the last message, opens: changes }
    - { name: undo, detail: Undo the last aider commit, action: undo }
    - { name: tokens, detail: Context token report, kind: terminal }
    - { name: clear, detail: Clear the chat history, role: destructive }
    - { name: run, hint: '<command>', detail: Run a shell command }
    - { name: test, hint: '<command>', detail: Run tests and fix failures }
