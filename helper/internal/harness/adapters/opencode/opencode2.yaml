# OpenCode 2.x, a rewrite: the TUI is a client of a server ("the v2 API"), by default
# a shared background service. Togo starts a private one for each session,
# `opencode serve --port N` with a fresh password, and the TUI with `--server URL`, so
# the API and its /api/event stream serve this TUI only. Checked on OpenCode 2.2.5
# against a real server: session create, prompt, the event stream (text, reasoning,
# tools, steps, executions), agent and model switches (the TUI footer follows them),
# interrupt, permissions (session.permission.reply) and the question tool (a form,
# session.form.reply). The selected adapter is this file or opencode.yaml (1.x), by the
# installed version.
adapter: opencode2
name: OpenCode
revision: 1
match: { agents: [opencode], commands: [opencode] }
harness: { version: [opencode, --version], pattern: '(\d+\.\d+\.\d+)', range: ">=2 <3" }
endpoint:
  kind: http
  server: [opencode, serve, --hostname, 127.0.0.1, --port, '{{.port}}']
  launch_args: [--server, 'http://127.0.0.1:{{.port}}']
  health: /api/info
  # The server reads OPENCODE_PASSWORD (Basic auth, user "opencode"); the TUI sends
  # the same variable to it.
  password_env: OPENCODE_PASSWORD
  username: opencode
# send.api stays listed though prompts are typed (see the note above `resume`): apps
# take its absence to mean a typed / line may be mirrored into the terminal key by key,
# which skips the helper's send checks. The helper decides how a prompt travels by
# whether the adapter has a `send` action, not by this capability.
capabilities: [chat, chat.stream, chat.anchors, send.api, send.queue, interrupt, commands,
  files, mode, model, needs.approvals, needs.questions, agents, background, changes, ports, status,
  resume, compact, mcp, settings]
# The terminal attaches a pasted file only when the paste is nothing but file
# paths; pasted with the text, a path stays text. So one paste per path.
images: { insert: per_path }
feeds:
  events:
    sse: { path: /api/event }
    # The stream tells what happens from now on. The session log holds the same events
    # from the conversation's start (checked on 2.2.5), so a chat opened after a helper
    # restart, or moved to another conversation, shows what was said before.
    history: { path: '/api/experimental/session/{{.conversation}}/log' }
    mapper: opencode2.events
    stability: documented
sources:
  # The terminal's session list asks for archived=false; an archived session is
  # not one to resume. The select drops one too, should a server ignore the filter.
  sessions:
    http: { path: '/api/session?directory={{.cwd | urlquery}}&limit=50&archived=false' }
    select: '[.data[] | select(.parentID == null and .time.archived == null)] | sort_by(-.time.updated)'
    cache: 30s
    stability: documented
  # Provider and model answers carry settings, headers and request bodies, where keys
  # live (`settings.apiKey`). The http runner strips secrets first; these paths remove
  # what is left of them.
  models:
    http: { path: '/api/model?location%5Bdirectory%5D={{.cwd | urlquery}}' }
    redact: ['.data[].settings', '.data[].headers', '.data[].body']
    # An item id is the Model.Ref the session model switch takes, as compact JSON
    # with sorted keys; the mapper reports the current one as model_ref.
    select: '[.data[] | select(.enabled and ((.type // "chat") == "chat")) | {id: ({id: .id, providerID: .providerID} | tojson), name: .name, provider: .providerID, providerName: .providerID}]'
    cache: 5m
    stability: documented
  providers:
    http: { path: '/api/provider?location%5Bdirectory%5D={{.cwd | urlquery}}' }
    redact: ['.data[].settings.apiKey', '.data[].headers', '.data[].body']
    select: '[.data[] | {id: (.integrationID // .id), name: .name, keySet: ((((.settings._set // []) | index("apiKey")) != null) or (.integrationID != null))}]'
    cache: 5m
    stability: documented
  # Integrations that take a key and have no connection: the model picker's
  # "Not set up" section, where an API key connects one.
  unconnected:
    http: { path: '/api/integration?location%5Bdirectory%5D={{.cwd | urlquery}}' }
    redact: ['.data[].connections']
    select: '[.data[] | select(((.connections // []) | length) == 0 and any(.methods[]; .type == "key")) | {id: .id, name: .name}] | sort_by(.name | ascii_downcase)'
    cache: 5m
    stability: documented
  # Agents and commands change when OpenCode reloads its config. The server says so
  # (agent.updated, command.updated) and the mapper answers with a new agents_rev or
  # commands_rev, which ends the cached copy at once instead of after five minutes.
  agents:
    http: { path: '/api/agent?location%5Bdirectory%5D={{.cwd | urlquery}}' }
    select: '[.data[] | select(.mode != "subagent" and (.hidden | not)) | {id: .id, name: .name, description: .description}]'
    cache: 5m
    cache_rev: agents_rev
    stability: documented
  commands:
    http: { path: '/api/command?location%5Bdirectory%5D={{.cwd | urlquery}}' }
    select: '.data'
    cache: 5m
    cache_rev: commands_rev
    stability: documented
  children:
    http: { path: '/api/session?parentID={{.state.harness_session | urlquery}}' }
    select: '[.data[] | {id: .id, title: (.title // "Subagent"), state: (if (.time.busy // 0) > (.time.idle // 0) then "running" else "done" end)}]'
    stability: documented
  # Shell commands OpenCode runs in the background, tagged with the session that
  # started them; only running ones are listed. The mapper shows a shell from its
  # shell.created on. This list brings back the ones a stream reconnect or a helper
  # restart lost sight of.
  shells:
    http: { path: '/api/shell?location%5Bdirectory%5D={{.cwd | urlquery}}' }
    select: '[.data[] | select(.metadata.sessionID == $state.harness_session) | {id: .id, title: (.command | gsub("\\s+"; " ") | .[:200]), state: .status}]'
    stability: documented
  mcp:
    http: { path: '/api/mcp?location%5Bdirectory%5D={{.cwd | urlquery}}' }
    select: '[.data[] | {id: .name, title: (.title // .name), state: .status.status}]'
    cache: 30s
    stability: documented
screens:
  model:
    primitive: picker
    title: Model
    section: composer
    capability: model
    source: models
    search: true
    map: { item.id: .id, item.title: .name, item.group: .providerName, selected: $state.model_ref }
    filters: [{ id: provider, label: Provider, kind: choice, field: provider }]
    on_select: set_model
    setup: { source: unconnected, map: { item.id: .id, item.title: .name }, action: add_provider_key, input: secret }
  providers:
    primitive: settings
    title: Providers
    section: more
    capability: settings
    source: providers
    fields:
      # A secret field never carries a value; keySet only says one exists.
      - { id: key, label: API key, kind: secret, value: .keySet, action: set_provider_key }
  resume:
    primitive: picker
    title: Resume
    section: more
    capability: resume
    source: sessions
    search: true
    map: { item.id: .id, item.title: .title, item.subtitle: '{{.time.updated | ago}}' }
    on_select: resume
  mcp:
    primitive: liveList
    title: MCP servers
    section: more
    capability: mcp
    source: mcp
actions:
  # These switch the session on the server (no config file is written), and the
  # TUI's footer follows (seen live).
  set_model:
    http: { method: POST, path: '/api/session/{{.state.harness_session}}/model', body: '{"model": {{.id | object}}}' }
    stability: documented
  set_mode:
    http: { method: POST, path: '/api/session/{{.state.harness_session}}/agent', body: '{"agent": {{.id | json}}}' }
    stability: documented
  # Connecting a key stores a credential in OpenCode's own store, as its
  # connect menu does.
  add_provider_key:
    label: Add key
    http: { method: POST, path: '/api/integration/{{.id}}/connect/key?location%5Bdirectory%5D={{.cwd | urlquery}}', body: '{"key": {{.value | json}}}' }
    stability: unverified
  set_provider_key:
    http: { method: POST, path: '/api/integration/{{.target}}/connect/key?location%5Bdirectory%5D={{.cwd | urlquery}}', body: '{"key": {{.value | json}}}' }
    stability: unverified
  # A / line from the composer or the palette runs as the server's command,
  # unless it names one of the terminal's own (commands.static, kind terminal).
  command:
    http: { method: POST, path: '/api/session/{{.state.harness_session}}/command', body: '{"name": {{.command | json}}, "text": {{.arguments | json}}}' }
    stability: documented
  # Before the first prompt there is no session (the TUI makes one with it),
  # so a model or mode picked then starts one here and the pick applies to
  # it. The TUI does not follow a session made over the API (seen on 2.2.5),
  # so it restarts on this one (--session), its footer showing the pick:
  # one session for the phone and the desk, and prompts typed there
  # continue it. Open chats are carried across the restart.
  start_session:
    http: { method: POST, path: '/api/session?location%5Bdirectory%5D={{.cwd | urlquery}}', body: '{}' }
    stability: documented
  show_session:
    relaunch: { argv: [opencode, --session, '{{.state.harness_session}}'] }
    stability: documented
  # Prompts are typed into the TUI, not posted to /api/session/{id}/prompt. The API
  # needs a session id, and nothing reports which session the TUI shows: after /new or
  # a fork in the terminal a posted prompt went to the session left behind (seen on
  # 2.2.5, 2.3.0 and 1.19.5). A typed prompt lands in the session on screen; the
  # mapper then follows it there (session.inbox.enqueued) and the chat starts over.
  # 2.x has no TUI control route: a resumed session is a restart on it.
  resume:
    relaunch: { argv: [opencode, --session, '{{.id}}'] }
    stability: documented
  compact:
    confirm: Compact the session now?
    http: { method: POST, path: '/api/session/{{.state.harness_session}}/compact', body: '{}' }
    stability: documented
  interrupt:
    http: { method: POST, path: '/api/session/{{.state.harness_session}}/interrupt' }
    stability: documented
  # Item ids are "<request>~<session>": a permission (per_...) has one question
  # "0" whose option is the decision; a form's question ids are field keys that
  # the form filter turns into the reply object.
  answer:
    branch:
      - when: '{{if eq (slice .target 0 4) "per_"}}true{{end}}'
        http: { method: POST, path: '/api/session/{{part "~" 1 .target}}/permission/{{part "~" 0 .target}}/reply', body: '{"decision": {{index (index .answers "0") 0 | json}}}' }
      # A form owned by "global" is found only in the folder it was asked in.
      - http: { method: POST, path: '/api/session/{{part "~" 1 .target}}/form/{{part "~" 0 .target}}/reply{{if eq (part "~" 1 .target) "global"}}?location%5Bdirectory%5D={{or .state.location .cwd | urlquery}}{{end}}', body: '{"answer": {{form .answers}}}' }
    stability: documented
  stop:
    role: destructive
    http: { method: POST, path: '/api/session/{{.target}}/interrupt' }
    stability: documented
# The modes are OpenCode's primary agents, which a user can add to: the agents
# source lists them. Build and Plan are what is offered while it cannot be read.
modes:
  choices: [{ id: build, label: Build }, { id: plan, label: Plan }]
  source: agents
  current: agents
  select: $state.mode
  set: set_mode
  # Before the first turn the footer under the input is the only record:
  # "┃  Build · <model>" (2.2.5).
  screen:
    - { line: '^\s*┃\s+Build · ', id: build }
    - { line: '^\s*┃\s+Plan · ', id: plan }
commands:
  static:
    - { name: models, detail: Choose the model, screen: model }
    - { name: sessions, detail: Resume a session, screen: resume }
    - { name: compact, detail: Summarise the session, action: compact }
    - { name: mcps, detail: MCP servers, screen: mcp }
    - { name: diff, detail: Review changes, opens: changes }
    # The terminal's own commands: the server does not list or run them, so
    # they are typed, and the terminal's / menu runs its first row on Enter.
    # Only names that are that first row before and inside a conversation
    # are here (seen on 2.2.5, and unconditional in the 2.3.0 source). Left
    # out: /undo, /redo, /fork, /rename, /timeline, /copy, /export and
    # /terminal exist only inside a conversation, and outside one the menu
    # runs another command or leaves the text in the input line; /update,
    # /restart and /highlights are not always there; /cd and /btw take an
    # argument their menu completes without sending.
    - { name: new, detail: Start a new session, kind: terminal }
    - { name: clear, detail: Close this session and start a new one, kind: terminal }
    - { name: open, detail: Open a session or project, kind: terminal }
    - { name: agents, detail: Switch agent, kind: terminal }
    - { name: variants, detail: Switch model variant, kind: terminal }
    - { name: connect, detail: Sign in to a provider, kind: terminal }
    - { name: usage, detail: Provider usage and limits, kind: terminal }
    - { name: stats, detail: Usage statistics, kind: terminal }
    - { name: status, detail: Server and connection status, kind: terminal }
    - { name: skills, detail: Pick a skill for the prompt, kind: terminal }
    - { name: worktrees, detail: Manage workspaces, kind: terminal }
    - { name: plugins, detail: Plugins, kind: terminal }
    - { name: settings, detail: Open settings, kind: terminal }
    - { name: themes, detail: Switch theme, kind: terminal }
    - { name: editor, detail: Write the prompt in your editor, kind: terminal }
    - { name: pair, detail: Pair a device, kind: terminal }
    - { name: reload, detail: Reload configuration, kind: terminal }
    - { name: debug, detail: Debug info, kind: terminal }
    - { name: help, detail: Help, kind: terminal }
    - { name: exit, detail: Quit OpenCode, kind: terminal, role: destructive }
  source: commands
  select: '[.[] | {name: .name, detail: .description, hint: ""}]'
mission:
  agents: { source: children }
  background: { source: shells, refresh: 10s }
